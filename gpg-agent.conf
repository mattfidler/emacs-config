# ~/.gnupg/gpg-agent.conf -- how long the key passphrase stays cached.
#
# mu4e runs `mbsync -a' every five minutes (mu4e-update-interval), mbsync asks
# ~/.local/bin/authinfo-pass for the gmail app password, and authinfo-pass has
# to decrypt ~/.authinfo.gpg to answer.  On the defaults -- ten minutes of
# cache, two hours at the outside -- that means a pinentry prompt every hour or
# so, for mail arriving in the background.  Eight hours is one prompt a working
# day.
#
# The trade is that the passphrase sits in gpg-agent's memory for that long.
default-cache-ttl 28800
max-cache-ttl 28800
