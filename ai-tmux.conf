# Config for the dedicated coding-agent tmux servers (tmux -L claude, tmux -L
# antigravity), used by ~/.local/bin/ai-tmux.  tmux here is only a detachable
# process holder -- Emacs owns the display and every key, so the prefix, status
# line and mouse are all turned off.

set -g prefix None
set -g prefix2 None
unbind-key -a

set -g status off
set -g mouse off
set -g set-titles off
setw -g automatic-rename off
set -g allow-rename off

# Agents use ESC to interrupt; any escape-time delay makes that feel broken.
set -g escape-time 0
set -g focus-events on

set -g history-limit 100000

# Follow whichever client attached most recently, so re-attaching from a
# different window size reflows instead of letterboxing.
set -g window-size latest
setw -g aggressive-resize on

# Keep the session alive when Emacs detaches; end it when the agent itself exits.
set -g destroy-unattached off
set -g remain-on-exit off

set -g default-terminal "xterm-256color"
set -as terminal-features ",*:RGB"

# Let a copy inside the agent reach Emacs and the X clipboard.
#
# Claude copies with `tmux load-buffer -w -', and tmux only honours the -w
# (write to the outside world) when it believes the attached terminal
# understands OSC 52.  It decides that from `terminal-features', whose
# built-in clipboard entry only matches xterm*; the terminal here is eat, which
# announces itself as eat-truecolor, so the copy stopped at the tmux paste
# buffer -- hence "copied to tmux buffer".  Claim the feature for every
# terminal, and switch set-clipboard from `external' (keep OSC 52 sequences,
# don't forward them) to `on' (forward them), which covers programs that write
# OSC 52 themselves rather than going through tmux.
set -as terminal-features ",*:clipboard"
set -g set-clipboard on
